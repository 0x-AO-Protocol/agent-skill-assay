name: "CLI"
description: Report a bug or propose a change to the agent-skill-assay command-line interface.
title: "[CLI]: "
labels: ["cli", "enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Scope: `skill_assay/cli.py`, `skill_assay/cli_mail.py`, `skill_assay/__main__.py`, and [docs/usage/cli.md](https://github.com/0x-AO-Protocol/agent-skill-assay/blob/main/docs/usage/cli.md).

        Also in scope when the change touches merged YAML config: `skill_assay/core/config.py` (`.skill-assay.yaml`, global `config.yaml` under `SKILL_ASSAY_CONFIG_DIR` / `%APPDATA%\\agent-skill-assay` on Windows).

        Splash menu (v0.5.1): `1=list`, `2=examples`, `3=test`, `4=paths`, `5=doctor`, `6=help`, `7=mail`.

        For loader/path **resolution logic** in `skill_assay/core/loader.py` (not CLI UX), use **Framework Feature** or **Bug Report** (Core Framework).

  - type: dropdown
    id: change_type
    attributes:
      label: Change type
      options:
        - Bug
        - Enhancement
        - Documentation only
    validations:
      required: true

  - type: dropdown
    id: command
    attributes:
      label: Command or area
      options:
        - agent-skill-assay (interactive menu)
        - skill-assay list
        - skill-assay test
        - skill-assay examples
        - skill-assay doctor
        - skill-assay config show
        - skill-assay paths (read-only)
        - agent-skill-assay (menu 4 / paths) — interactive paths submenu
        - skill-assay mail
        - agent-skill-assay (menu 7 / mail) — interactive mail submenu
        - agent-skill-assay (menu 6 / help) — tiered help
        - agent-skill-assay --help / --version
        - python -m skill_assay
        - Other
    validations:
      required: true

  - type: dropdown
    id: install_method
    attributes:
      label: Install method
      options:
        - pip install agent-skill-assay (PyPI)
        - pip install -e ".[dev]" or ".[dev,all]" (editable clone)
        - Both / unknown
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Expected vs actual behavior, or the feature you want. Note whether the change affects global config, project `.skill-assay.yaml`, or read-only CLI output.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce (bugs)
      placeholder: |
        skill-assay mail signature show
        Expected: ...
        Actual: ...
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        Windows 11, Python 3.12, agent-skill-assay 0.1.0
        Config: ~/.config/skill_assay/config.yaml and/or .skill-assay.yaml
    validations:
      required: false
