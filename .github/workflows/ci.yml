name: Agent Skill Assay CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,all]"

    - name: Check formatting with black
      run: python -m black --check .

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # strict check against our config
        flake8 . --count --statistics

    - name: Skill bundle tests
      env:
        ANTHROPIC_API_KEY: "placeholder_key_for_ci"
        ETHERSCAN_API_KEY: "placeholder_key_for_ci"
      run: pytest skills/

    - name: Framework and maintainer tests
      env:
        ANTHROPIC_API_KEY: "placeholder_key_for_ci"
        ETHERSCAN_API_KEY: "placeholder_key_for_ci"
      run: pytest tests/

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Build wheel
      run: |
        python -m pip install --upgrade pip build
        python -m build --wheel --outdir dist/

    - name: Install wheel in clean venv
      run: |
        python -m venv /tmp/wheel-smoke-venv
        /tmp/wheel-smoke-venv/bin/pip install --upgrade pip
        /tmp/wheel-smoke-venv/bin/pip install dist/agent_skill_assay-*.whl

    - name: Wheel packaging smoke test
      run: /tmp/wheel-smoke-venv/bin/python scripts/wheel_smoke_test.py

  provenance-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install provenance checker dependency
      run: python -m pip install pyyaml

    - name: Verify static bundle provenance
      run: python scripts/provenance.py --check

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Install pinned gitleaks CLI
      env:
        GITLEAKS_VERSION: "8.30.1"
        GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      run: |
        archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        curl -fsSL -o "${RUNNER_TEMP}/${archive}" \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
        echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
        mkdir -p "${RUNNER_TEMP}/gitleaks"
        tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/gitleaks" gitleaks
        echo "${RUNNER_TEMP}/gitleaks" >> "${GITHUB_PATH}"

    - name: Scan working tree with gitleaks
      run: gitleaks dir . --no-banner --redact --verbose

  public-text-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Run public-text lint
      run: python scripts/public_text_lint.py
