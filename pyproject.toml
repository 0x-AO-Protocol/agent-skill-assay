[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-skill-assay"
version = "0.1.0"
description = "AO registry and runtime for modular agent skills."
readme = "README.md"
authors = [
  { name = "AO" },
]
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests",
    "pyyaml",
    "python-dotenv",
    "beautifulsoup4",
    "packaging",
    "jsonschema>=4.0",
    "rich>=13.0",
]
requires-python = ">=3.10"

keywords = ["ai", "agents", "skills", "llm", "tools", "framework", "agent-tools", "registry"]

[project.urls]
Homepage = "https://github.com/0x-AO-Protocol/agent-skill-assay"
Repository = "https://github.com/0x-AO-Protocol/agent-skill-assay"
Documentation = "https://github.com/0x-AO-Protocol/agent-skill-assay/blob/main/docs/introduction.md"
Issues = "https://github.com/0x-AO-Protocol/agent-skill-assay/issues"
Changelog = "https://github.com/0x-AO-Protocol/agent-skill-assay/blob/main/CHANGELOG.md"

[project.scripts]
skill-assay = "skill_assay.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
    "flake8",
    "black",
    "setuptools>=61.0",
]
gemini = [
    "google-genai",
]
claude = [
    "anthropic",
]
openai = [
    "openai",
]
agents = [
    "google-genai",
    "anthropic",
    "openai",
]
bedrock = [
    "boto3",
]

# --- extras: begin generated by scripts/sync_extras.py ---

monitoring = []

security = []

wellness = [
    "google-genai",
]

monitoring_business_diagnostic = []

monitoring_kpi_gate = []

security_prompt_injection_firewall = []

wellness_mental_coach = [
    "google-genai",
]

all = [
    "google-genai",
]

# --- extras: end generated by scripts/sync_extras.py ---

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["skill_assay*", "skills*"]

# Non-Python skill assets (yaml, md, json, data/) ship via MANIFEST.in (graft skills)
# and this wildcard. No per-skill entries needed when adding registry skills.
[tool.setuptools.package-data]
skill_assay = ["support_policy.json", "schemas/*.json"]
skills = ["**/*"]

[tool.pytest.ini_options]
testpaths = ["tests", "skills"]
addopts = "--ignore=examples"

[tool.black]
line-length = 88
target-version = ["py310"]
