name: compliance/scoped_risk_literature_scan
version: 0.1.0
description: >
  Screens the publications a caller collected for one review cycle and checks
  the caller's annotations of the items it keeps. The caller reads its
  configured sources with its own tools and reports, per source, whether the
  source was reachable and which items it found. screen drops items outside
  the cycle window, the declared jurisdictions or the declared risk domains,
  drops repeats by a fixed title rule, orders the rest (client-relevant first,
  then newest first, then fixed tie-breaks), applies the item cap, flags client
  relevance by exposure tags with a follow-up date, counts the in-scope items
  per domain, jurisdiction and source kind with the change from the previous
  cycle, and returns one annotation slot per kept item. compile repeats the
  screen, checks that every kept item has exactly one annotation within the
  caps, credits competence minutes only when the request attests them, holds
  the record as pending review and returns it for the caller to store. The
  check covers presence, keys, enums and caps; it never reads or judges what a
  summary or impact note says. execute() makes no model call and uses no
  network, clock, file or environment access; under the standard profile,
  identical input returns identical output.
short_description: "Screen a reported collection of publications by window, scope and cap, then check the caller's annotations before review."
issuer:
