name: security/prompt_injection_firewall
version: 0.1.0
description: >
  Offline deterministic pre-flight scanner that detects and sanitizes prompt injection,
  hidden HTML payloads, invisible Unicode smuggling, confusable evasion, nested encodings,
  and instruction override attempts before untrusted text reaches an LLM.
short_description: "Offline prompt-injection firewall with local detectors and sanitization."
detectors:
  - hidden_markup
  - invisible_unicode
  - confusable_skeleton
  - encoded_payload
  - instruction_lexicon
  - context_mismatch
  - resource_limits
issuer:
  name: Masa
  email: masa88keith@gmail.com
  github: mrmasa88
  org: AO
trust_tier: L0
provenance:
  source: agent-skill-assay-sources@406444f51930aabffd1da9a9fb3b5f58b85a3415:skills/security/prompt_injection_firewall
  content_sha256: 02781c0d502d4a4116c7e9067f27d7a88284cefd30793c8ae98c9fb0a616d1c1
  ported_on: "2026-09-25"
economic_effect:
  claim: "Performs the task in deterministic code instead of LLM generation, reducing LLM token consumption."
  baseline_task: "The same task performed by an LLM agent without this skill (prompt-only)."
  metric: "LLM tokens (input + output) per task run."
  method: "Run the skill's reference fixtures through (a) the baseline agent and (b) the same agent calling the skill; publish the median tokens per run for both and the reduction."
norm_version: norms-1.0.0
category: security
parameters:
  type: object
  properties:
    source_text:
      type: string
      description: Raw untrusted text about to enter model context (web, PDF, email, tool output).
    sensitivity:
      type: string
      description: Detection strictness level.
      enum:
        - strict
        - balanced
        - lenient
      default: balanced
    input_mode:
      type: string
      description: Input parser mode for HTML or markdown hidden-content checks.
      enum:
        - plain
        - html
        - markdown
        - auto
      default: auto
  required:
    - source_text
outputs:
  is_safe:
    type: boolean
    description: >
      True only when the completed scan finds no profile-independent resource
      limit or critical exfiltration failure and the selected sensitivity
      profile does not mark the findings unsafe. Profile changes thresholds,
      never the meaning of safe.
  risk_level:
    type: string
    description: Aggregated risk level (none, low, medium, high, critical).
  detected_threat:
    type: string
    description: Primary human-readable threat summary when unsafe.
  findings:
    type: array
    description: Structured findings with category, channel, severity, span, and evidence.
  sanitized_text:
    type: string
    description: Text with flagged spans removed when unsafe content was sanitizable.
  offline:
    type: boolean
    description: Always true; every check runs locally with no network or API keys.
  sensitivity:
    type: string
    description: Sensitivity level used for the scan.
requirements: []
constitution: |
  1. OFFLINE ONLY: Detection runs without network access, cloud APIs, or API keys.
  2. NO AUDITING MODEL: Never feed untrusted text to an LLM auditor; pattern-analyze only.
  3. DETERMINISTIC: Identical input yields identical output; no runtime code generation.
  4. SANITIZE WHEN POSSIBLE: Strip hidden payloads while preserving legitimate content.
  5. EXPLAINABLE: Every finding includes category, channel, severity, span, and evidence.
  6. HONEST LIMITS: This is risk reduction, not a guarantee against novel semantic injections.
presentation:
  icon: shield
  color: "#1f2937"
