name: finance/period_close
version: 0.1.0
description: >
  Deterministic period close over a journal and a chart of accounts supplied
  by the host. validate checks the journal against the chart and returns
  findings from a closed registry: blocking faults, warnings and one
  informational code. close runs validate first and fails closed on any
  blocking finding unless soft_close is set; it returns a trial balance,
  income statement, balance sheet, direct-method cash flow, checks, gap
  notes, ratios and observations. Given prior periods' journals it names
  recurring items that are missing or out of line against their past median,
  and never fills them in. Single currency, single entity; amounts are
  decimal strings and every figure is computed with one private decimal
  context, so no binary floating-point value reaches the output. Closed
  error registry and fail-closed contract errors; no network, no clock, no
  file access; identical input always returns identical output.
short_description: "Close a period from a journal: trial balance, statements, checks and gap notes. Use for the monthly or quarterly close."
issuer:
  name: Masa
  email: masa88keith@gmail.com
  github: mrmasa88
  org: AO
trust_tier: L0
provenance:
  anchor: repository
  content_sha256: "9f8fe4bb4ca85ea4d26e56cb81174e69496a816d0ce2df9e7d30edb5458ffffe"
